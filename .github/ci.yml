name: Frontend CI Check

# این اکشن به محض اینکه هر کدام از اعضای تیم به سمت شاخه develop درخواست Pull Request (PR) بزنند، خودکار اجرا می‌شود.
on:
  pull_request:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Check Code Quality (Lint)
        run: pnpm lint

      - name: Try Building Project
        run: pnpm build
